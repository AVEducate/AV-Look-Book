# AV Look Book — build installers on every version tag (v0.1.0, v0.2.0 …)
# and attach them, plus the app HTML (for in-app content updates), to the
# GitHub Release for that tag. Unsigned until Apple / Windows signing is set up
# (see electron/README.md). Trigger by hand from the Actions tab too.
name: Build installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Install
        working-directory: electron
        run: npm ci --no-audit --no-fund

      - name: Bundle the current app HTML into the shell
        working-directory: electron
        run: npm run copy-html

      - name: Build + publish (macOS)
        if: runner.os == 'macOS'
        working-directory: electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"   # unsigned for now
        run: npx electron-builder --mac --publish always

      - name: Build + publish (Windows)
        if: runner.os == 'Windows'
        working-directory: electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always

      - name: Attach the app HTML to the release (content updates)
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: deploy/lookbook_builder.html

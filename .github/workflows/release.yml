# AV Look Book — build installers on every version tag (v0.1.0, v0.2.0 …)
# and attach them, plus the app HTML (for in-app content updates), to the
# GitHub Release for that tag. Unsigned until Apple / Windows signing is set up
# (see electron/README.md). Trigger by hand from the Actions tab too.
#
# 2026-09-14: macOS and Windows used to publish in parallel and raced to create
# the same release — the loser (Windows on v0.2.35 and v0.2.38) failed and the
# release shipped without its .exe. Windows now waits for the macOS job (which
# creates the release) and retries the publish a couple of times.
# 2026-09-19: release channels. A tag with a '-' in it (v0.3.0-beta.1) is published as a PRE-RELEASE: the Windows
# self-updater and the in-app content updater (releases/latest) both ignore pre-releases, so users stay on the last
# full release. A plain tag (v0.2.149, v0.3.0) is a full release and reaches every user. See RELEASE.md.
name: Build installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Install
        working-directory: electron
        run: npm ci --no-audit --no-fund

      - name: Bundle the current app HTML into the shell
        working-directory: electron
        run: npm run copy-html

      # 2026-10-10: the install window. electron-builder's own window settings (.DS_Store) carry a background link
      # that current macOS Finder ignores, so the DMGs showed no background. Build without publishing, copy the
      # Finder-made settings (build/dmg/DS_Store.template) into each DMG, refresh blockmaps + latest-mac.yml, then
      # publish exactly those files. A hand-started run (workflow_dispatch) keeps the DMGs as a run artifact to check.
      - name: Build (macOS)
        working-directory: electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"   # unsigned for now
        # one architecture at a time: both DMGs use the disk name "AV Look Book", so building them together collides.
        # The arch must be in the TARGET (dmg:arm64): with plain --arm64 the config's target list still builds both.
        run: |
          npx electron-builder --mac dmg:arm64 --publish never
          mv dist/latest-mac.yml dist/latest-mac-arm64.yml
          npx electron-builder --mac dmg:x64 --publish never

      - name: Finish the install window (macOS)
        working-directory: electron
        run: node build/dmg/finish-dmg.mjs dist

      - name: Keep the DMGs (hand-started runs only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: |
            electron/dist/*.dmg
            electron/dist/latest-mac.yml
          retention-days: 7

      - name: Publish (macOS)
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EP_PRE_RELEASE: ${{ contains(github.ref_name, '-') }}   # beta tags are born as pre-releases
        run: |
          files=""
          for f in dist/*.dmg dist/*.dmg.blockmap dist/latest-mac.yml; do files="$files -f $f"; done
          npx electron-builder publish $files

      - name: Check the DMGs reached the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          names=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          for n in AVLookBook-mac-arm64.dmg AVLookBook-mac-x64.dmg latest-mac.yml; do
            echo "$names" | grep -qx "$n" || { echo "missing on the release: $n"; exit 1; }
          done

      - name: Attach the app HTML to the release (content updates)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            deploy/lookbook_builder.html
            deploy/quick_guide.html
            deploy/quick_guide.pdf

  win:
    needs: mac            # the release exists by now — no create-release race
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Install
        working-directory: electron
        run: npm ci --no-audit --no-fund

      - name: Bundle the current app HTML into the shell
        working-directory: electron
        run: npm run copy-html

      - name: Build + publish (Windows, up to 3 attempts)
        working-directory: electron
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EP_PRE_RELEASE: ${{ contains(github.ref_name, '-') }}
        run: |
          $ok = $false
          foreach ($i in 1..3) {
            npx electron-builder --win --publish always
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            Write-Host "publish attempt $i failed — retrying in 30s"
            Start-Sleep -Seconds 30
          }
          if (-not $ok) { exit 1 }

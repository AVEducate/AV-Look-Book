<!-- AV Look Book · live download counter for the Squarespace landing page.
     Paste this whole block into a Code Block (Squarespace: Add Block → Code, leave it on HTML).
     It reads the public GitHub release list in the visitor's browser (no key, no login) and keeps the number for an hour in the
     visitor's browser. 2026-10-22 (Omar: "we also lost that download counter, can we bring that back?"): it never shows less than
     FLOOR, the real total that day; when GitHub does not answer (its hourly limit per network is low and phone networks share it),
     it shows the last good number or FLOOR, never an old 0. -->
<div id="avlb-downloads" style="font:600 15px/1.4 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#9aa0aa;letter-spacing:.02em;min-height:1.4em;text-align:center;margin-top:10px"></div>
<script>
(function(){
  var MODE='raw';           // 'raw' shows GitHub's plain total (Omar, 2026-09-17); 'estimate' subtracted one fetch per installer file and threw real downloads away
  var SINCE='2026-09-14';   // only releases published on or after this date (the day the site went public); '' = all time
  var FLOOR=983;            // GitHub's total on 2026-10-22 by the same rules; never shown less (downloads only go up)
  var TEXT=function(n){ return n.toLocaleString()+(n===1?' download':' downloads')+' and counting'; };
  var el=document.getElementById('avlb-downloads'); if(!el) return;
  // sit right under the email form: move out of this block, whose grid cell then collapses
  try{ var nl=document.querySelector('.sqs-block-newsletter .sqs-block-content'); var fe=el.closest('.fe-block'); if(nl){ nl.appendChild(el); if(fe) fe.style.display='none'; } }catch(e){}
  var KEY='avlb-dl-cache', HOUR=3600000;
  function best(n){ return Math.max(n||0,FLOOR); }
  try{ var c=JSON.parse(localStorage.getItem(KEY)||'null'); if(c&&c.n>0&&Date.now()-c.t<HOUR){ el.textContent=TEXT(best(c.n)); return; } }catch(e){}
  var total=0;
  function page(p){
    return fetch('https://api.github.com/repos/AVEducate/AV-Look-Book/releases?per_page=100&page='+p,{headers:{Accept:'application/vnd.github+json'}})
      .then(function(r){ if(!r.ok) throw new Error('GitHub '+r.status); return r.json(); })
      .then(function(rels){
        rels.forEach(function(rel){
          if(SINCE&&String(rel.published_at||'').slice(0,10)<SINCE) return;
          (rel.assets||[]).forEach(function(a){
            if(!/\.(dmg|exe|AppImage)$/i.test(a.name)) return;
            var n=a.download_count||0;
            total+=(MODE==='estimate')?Math.max(0,n-1):n;
          });
        });
        if(rels.length===100) return page(p+1);
      });
  }
  page(1).then(function(){ var n=best(total); el.textContent=TEXT(n); try{ localStorage.setItem(KEY,JSON.stringify({n:n,t:Date.now()})); }catch(e){} })
         .catch(function(){ var n=FLOOR; try{ var c=JSON.parse(localStorage.getItem(KEY)||'null'); if(c&&c.n>n) n=c.n; }catch(e){} el.textContent=TEXT(n); });
})();
</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcome to AV Look Book</title>
<style>
  :root{
    /* 2026-09-14 (shell 0.2.38): cool-grey ramp + #252a33 hairlines + #4ec3e0 cyan, matching app build 16ge */
    --bg:#0c0e12; --panel:#14181f; --line:#252a33; --line-soft:rgba(255,255,255,.08);
    --text:#e2e4e8; --muted:#8a94a3; --danger:#ff4d5a;
    /* welcome-grey (Omar 2026-10-14): no cyan on this window; pointed at / clicked = a lighter grey than the button and the window */
    --hi:#5d6778; --hi-bg:#1a1f28;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--text);font:13px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,"Segoe UI",sans-serif;
       display:grid;grid-template-columns:300px 1fr;overflow:hidden;-webkit-user-select:none;user-select:none}
  .left{padding:34px 28px 22px;border-right:1px solid var(--line-soft);display:flex;flex-direction:column;align-items:center;gap:10px}
  .left img{width:112px;height:112px;border-radius:26px;box-shadow:0 14px 34px rgba(0,0,0,.55)}
  .left .ver{color:var(--muted);font-size:11px;letter-spacing:.06em;margin-bottom:18px}
  .btn{width:100%;padding:11px 14px;border-radius:4px;border:1px solid var(--line);background:linear-gradient(180deg,#1c222c 0%,#14181f 100%);color:var(--text);
       font:inherit;font-weight:600;cursor:pointer;text-align:center;transition:background .12s,border-color .12s}
  .btn:hover,.btn:active,.btn:focus-visible{background:linear-gradient(180deg,#272e3a 0%,#1d232d 100%);border-color:var(--hi);outline:none}
  .btn:disabled{opacity:.4;cursor:default;background:linear-gradient(180deg,#1c222c 0%,#14181f 100%);border-color:var(--line)}
  .left .spacer{flex:1}
  label.chk{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;cursor:pointer}
  label.chk input{accent-color:var(--muted);width:14px;height:14px;margin:0}
  .right{padding:30px 34px 22px;display:flex;flex-direction:column;min-width:0}
  h2{margin:0 0 16px;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--text);display:flex;align-items:center;gap:8px}
  h2::before{content:"";width:2px;height:10px;border-radius:1px;background:var(--hi);flex-shrink:0}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:14px;flex:1;min-height:0}
  .tile{position:relative;display:flex;flex-direction:column;border:1px solid var(--line-soft);border-radius:8px;background:var(--panel);
        overflow:hidden;cursor:pointer;min-height:0;transition:border-color .12s,transform .12s}
  .tile:hover{border-color:var(--hi)}
  .tile:active{transform:scale(.99)}
  .tile .thumb{flex:1;min-height:0;background:#0c0f14 center/cover no-repeat;display:flex;align-items:center;justify-content:center;
               color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
  .tile .thumb.img{background-size:cover}
  .tile .meta{padding:8px 10px 9px;border-top:1px solid var(--line-soft)}
  .tile .name{font-weight:700;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tile .sub{color:var(--muted);font-size:10.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tile.empty{border-style:dashed;cursor:pointer}
  .tile.empty .thumb{color:var(--muted);text-transform:none;letter-spacing:.02em;font-size:13px;font-weight:600}
  .tile.missing{opacity:.55}
  .tile.missing .thumb::after{content:"FILE MISSING";color:var(--danger)}
  .tile .x{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:4px;border:1px solid rgba(255,255,255,.18);
           background:rgba(12,15,20,.85);color:#c9d1d9;font:700 13px/20px inherit;text-align:center;cursor:pointer;opacity:0;transition:opacity .12s}
  .tile:hover .x{opacity:1}
  .tile .x:hover{border-color:var(--danger);color:var(--danger)}
  .foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:10px}
  .link{background:transparent;border:1px solid var(--line-soft);border-radius:4px;color:var(--text);padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}
  .link:hover{border-color:var(--hi);background:var(--hi-bg)}
  .hint{color:var(--muted);font-size:11px}
  /* More-projects list */
  .list{flex:1;min-height:0;overflow:auto;border:1px solid var(--line-soft);border-radius:8px;background:var(--panel)}
  .row{display:flex;align-items:center;gap:12px;padding:9px 12px;border-bottom:1px solid var(--line-soft);cursor:pointer}
  .row:last-child{border-bottom:none}
  .row:hover{background:var(--hi-bg)}
  .row .name{font-weight:700;flex:0 0 200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .file{color:var(--muted);flex:1;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:rtl;text-align:left}
  .row .when{color:var(--muted);font-size:11px;flex:0 0 auto}
  .row .x{position:static;opacity:1;width:20px;height:20px;line-height:18px;flex:0 0 auto}
  .row.missing .name{color:var(--danger)}
  .empty-note{padding:26px;text-align:center;color:var(--muted)}
  /* 2026-09-13 (shell 0.2.19): square corners to match app build 16fm — buttons/pills 4px,
     recessed pill faces 2px, dialog 8px; project tiles stay 8px cards like the app's preset rows. */
  /* Remove / trash confirmation — same anatomy as the app's own dialogs
     (#dlg-overlay / .dlg-box v-warning): strip + icon + uppercase title,
     body text, pill buttons in a footer row. */
  .veil{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.78);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center}
  .dlg{min-width:320px;max-width:480px;background:#10131a;border-radius:8px;overflow:hidden;border:1px solid rgba(240,192,96,.32);
       box-shadow:0 20px 60px rgba(0,0,0,.9);animation:pop .18s cubic-bezier(.4,.2,.2,1.1)}
  @keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
  .dlg-hdr{display:flex;align-items:center;gap:10px;padding:16px 24px;border-bottom:1px solid rgba(255,255,255,.08);
           background:linear-gradient(90deg,rgba(240,192,96,.08) 0%,transparent 60%)}
  .dlg-strip{width:3px;height:18px;border-radius:2px;flex-shrink:0;background:#f0c060;box-shadow:0 0 8px #f0c060}
  .dlg-icon{font-size:18px;line-height:1;color:#f0c060;flex-shrink:0}
  .dlg h3{margin:0;flex:1;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#f0c060;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dlg-body{padding:16px 24px;font-size:12.5px;line-height:1.55;color:var(--text);white-space:pre-wrap}
  .dlg-foot{display:flex;gap:8px;justify-content:flex-end;padding:12px 24px;border-top:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.015)}
  .pill{position:relative;isolation:isolate;height:40px;padding:10px 22px;border-radius:4px;font:inherit;font-size:11px;letter-spacing:.02em;
        cursor:pointer;background:#0a0d12;border:1px solid rgba(255,255,255,.1);color:var(--text);font-weight:400;transition:all .15s;white-space:nowrap}
  .pill::before{content:"";position:absolute;inset:3px;border-radius:2px;z-index:-1;background:linear-gradient(180deg,#232a36,#171c24);box-shadow:0 1px 2px rgba(0,0,0,.4)}
  .pill:hover::before{filter:brightness(1.15)}
  .pill.warn{font-weight:600;color:#221500;border-color:#f0c060;box-shadow:0 0 12px rgba(240,192,96,.45)}
  .pill.warn::before{background:linear-gradient(180deg,#f0c060,#c9933a);box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
  .pill.danger{font-weight:600;color:#fff;border-color:#ff4d5a;box-shadow:0 0 12px rgba(255,77,90,.45)}
  .pill.danger::before{background:linear-gradient(180deg,#ff4d5a,#c1212f);box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
  /* welcome-grey: the dialog's buttons are the I/O card's grey line icons, no box at rest or pointed at; only the icon lights
     (Omar: no red, the trash too). Their words are the hover tips. */
  .dlg-foot.icons{gap:14px;align-items:center}
  .ib{width:30px;height:30px;display:grid;place-items:center;background:none;border:0;padding:0;margin:0;color:var(--muted);cursor:pointer;transition:color .12s}
  .ib svg{width:16px;height:16px;display:block}
  .ib:hover,.ib:focus-visible{color:var(--text);outline:none}
  .dlg-path{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--muted)}
  [hidden]{display:none!important}
</style>
</head>
<body>
  <div class="left">
    <img id="icon" src="app://lookbook/icon.png" alt="">
    <div class="ver" id="ver">&nbsp;</div>
    <button class="btn" id="btn-new">New Project</button>
    <button class="btn" id="btn-last">Open Last Project</button>
    <button class="btn" id="btn-help">Getting Started</button>
    <div class="spacer"></div>
    <label class="chk"><input type="checkbox" id="chk-launch"> Show this window on launch</label>
  </div>
  <div class="right">
    <h2 id="heading">Recent Projects</h2>
    <div class="grid" id="grid"></div>
    <div class="list" id="list" hidden></div>
    <div class="foot">
      <button class="link" id="btn-more">More projects…</button>
      <span class="hint" id="hint">Projects live in Documents › AV Look Book. Use File › Open to browse for a file.</span>
    </div>
  </div>
<div class="veil" id="veil" hidden>
  <div class="dlg" role="dialog" aria-labelledby="dlg-title">
    <div class="dlg-hdr"><div class="dlg-strip"></div><span class="dlg-icon">⚠</span><h3 id="dlg-title">Remove project?</h3></div>
    <div class="dlg-body" id="dlg-text"></div>
    <div class="dlg-foot icons">
      <button class="ib" id="dlg-find" title="Find the file…" aria-label="Find the file and relink it" hidden><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><circle cx="12" cy="13.5" r="2.6"/><line x1="14" y1="15.5" x2="16.5" y2="18"/></svg></button>
      <button class="ib" id="dlg-remove" title="Remove from list" aria-label="Remove from Recent Projects"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
      <button class="ib" id="dlg-trash" title="Move to Trash" aria-label="Move the file to the Trash"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg></button>
      <button class="ib" id="dlg-cancel" title="Cancel (Esc)" aria-label="Cancel"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg></button>
    </div>
  </div>
</div>
<script>
(function(){
  const api = window.lookbookWelcome;
  const SLOTS = 6;
  let data = { items: [], showOnLaunch: true, version: '', build: '' };
  let showingList = false;

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function ago(ts){
    if (!ts) return '';
    const m = Math.round((Date.now() - ts) / 60000);
    if (m < 1) return 'just now';
    if (m < 60) return m + ' min ago';
    const h = Math.round(m / 60); if (h < 24) return h + (h === 1 ? ' hour ago' : ' hours ago');
    const d = Math.round(h / 24); if (d < 30) return d + (d === 1 ? ' day ago' : ' days ago');
    return new Date(ts).toLocaleDateString();
  }
  function base(p){ return String(p || '').split(/[\\/]/).pop(); }

  function renderGrid(){
    const g = $('grid'); g.innerHTML = '';
    const items = data.items.slice(0, SLOTS);
    for (let i = 0; i < SLOTS; i++) {
      const it = items[i];
      const t = document.createElement('div');
      if (!it) {
        t.className = 'tile empty';
        t.innerHTML = '<div class="thumb">New Project</div>';
        t.onclick = () => api.action('new');
      } else {
        t.className = 'tile' + (it.missing ? ' missing' : '');
        t.innerHTML =
          '<div class="thumb' + (it.thumb ? ' img' : '') + '"' + (it.thumb ? ' style="background-image:url(' + it.thumb + ')"' : '') + '>' + (it.thumb || it.missing ? '' : 'No preview yet') + '</div>' +
          '<div class="meta"><div class="name" title="' + esc(it.path) + '">' + esc(it.name || base(it.path)) + '</div>' +
          '<div class="sub">' + esc(base(it.path)) + ' · ' + esc(ago(it.lastOpened)) + '</div></div>' +
          '<div class="x" title="Remove or delete this project">✕</div>';
        t.onclick = () => it.missing ? askRemove(it) : api.action('open', it.id);   /* welcome-grey: find it and relink it */
        t.querySelector('.x').onclick = (e) => { e.stopPropagation(); askRemove(it); };
      }
      g.appendChild(t);
    }
  }
  function renderList(){
    const l = $('list'); l.innerHTML = '';
    if (!data.items.length) { l.innerHTML = '<div class="empty-note">No projects yet.</div>'; return; }
    data.items.forEach(it => {
      const r = document.createElement('div');
      r.className = 'row' + (it.missing ? ' missing' : '');
      r.innerHTML = '<div class="name">' + esc(it.name || base(it.path)) + '</div><div class="file" title="' + esc(it.path) + '">' + esc(it.path) + '</div>' +
                    '<div class="when">' + esc(ago(it.lastOpened)) + '</div><div class="x" title="Remove or delete this project">✕</div>';
      r.onclick = () => it.missing ? askRemove(it) : api.action('open', it.id);
      r.querySelector('.x').onclick = (e) => { e.stopPropagation(); askRemove(it); };
      l.appendChild(r);
    });
    const br = document.createElement('div');
    br.className = 'row'; br.innerHTML = '<div class="name">Browse for a file…</div><div class="file">Open a project that is not in this list</div>';
    br.onclick = () => api.action('browse');
    l.appendChild(br);
  }
  function render(){
    $('ver').textContent = (data.version ? 'v' + data.version : '') + (data.build ? '  ·  app ' + data.build : '');
    $('chk-launch').checked = !!data.showOnLaunch;
    $('btn-last').disabled = !data.items.length;
    $('heading').textContent = showingList ? 'All Projects (' + data.items.length + ')' : 'Recent Projects';
    $('grid').hidden = showingList; $('list').hidden = !showingList;
    $('btn-more').textContent = showingList ? 'Back to recent' : ('More projects…' + (data.items.length > SLOTS ? ' (' + (data.items.length - SLOTS) + ' older)' : ''));
    showingList ? renderList() : renderGrid();
  }
  let pendingRemove = null;
  function askRemove(it){
    pendingRemove = it;
    $('dlg-title').textContent = it.missing ? 'File missing' : 'Remove project?';
    if (it.missing) $('dlg-text').innerHTML = '\u201c' + esc(it.name || base(it.path)) + '\u201d is no longer where it was:\n<span class="dlg-path">' + esc(it.path) + '</span>\nFind the file to relink it, or remove it from the list.';
    else $('dlg-text').textContent = 'Remove \u201c' + (it.name || base(it.path)) + '\u201d from Recent Projects, or move the file itself to the Trash.\nTrash can be undone from the Finder.';
    $('dlg-trash').hidden = !!it.missing;
    $('dlg-find').hidden = !it.missing;
    $('veil').hidden = false;
  }
  $('dlg-remove').onclick = async () => { const it = pendingRemove; $('veil').hidden = true; if (it) await api.action('removeConfirmed', it.id, false); refresh(); };
  $('dlg-trash').onclick  = async () => { const it = pendingRemove; $('veil').hidden = true; if (it) await api.action('removeConfirmed', it.id, true); refresh(); };
  $('dlg-cancel').onclick = () => { $('veil').hidden = true; pendingRemove = null; };
  $('dlg-find').onclick = async () => { const it = pendingRemove; $('veil').hidden = true; pendingRemove = null; if (it) await api.action('relink', it.id); refresh(); };
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('veil').hidden) { $('veil').hidden = true; pendingRemove = null; } });
  $('veil').onclick = (e) => { if (e.target === $('veil') && e.detail < 2) { $('veil').hidden = true; pendingRemove = null; } };   /* welcome-grey: e.detail 2 = the double-click that opened it */
  async function refresh(){ try { data = await api.list(); } catch (e) {} render(); }

  $('btn-new').onclick  = () => api.action('new');
  $('btn-last').onclick = () => { const it = data.items[0]; if (it && it.missing) askRemove(it); else api.action('openLast'); };
  $('btn-help').onclick = () => api.action('gettingStarted');
  $('btn-more').onclick = () => { showingList = !showingList; render(); };
  $('chk-launch').onchange = (e) => api.action('setShowOnLaunch', e.target.checked);
  api.onRefresh(refresh);
  refresh();
})();
</script>
</body>
</html>

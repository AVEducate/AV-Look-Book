<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;width:660px;height:500px;overflow:hidden}

  .band{position:absolute;left:0;top:0;right:0;height:166px;background:linear-gradient(160deg,#0a1322 0%,#0f1c33 100%);box-shadow:0 6px 18px rgba(0,0,0,.18)}

  .arrow{position:absolute;left:262px;top:264px;width:136px;height:64px}
  .cap{position:absolute;left:0;right:0;top:384px;text-align:center;color:#8a8a90;font-size:15px}
  .cap b{color:#5c5c62;font-weight:700}
  .note{position:absolute;left:30px;right:30px;top:418px;text-align:center;color:#9a9aa0;font-size:11.5px;line-height:1.45}
  .note b{color:#6c6c72;font-weight:600}
</style></head>
<body>
  <div class="band"></div>

  <div class="tag">plan the show &middot; engineer the system</div>
  <svg class="arrow" viewBox="0 0 136 64"><path d="M2 20 H78 V2 L134 32 L78 62 V44 H2 Z" fill="#2b2b2f"/></svg>
